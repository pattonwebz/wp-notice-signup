name: Accessibility check (local WordPress)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WORDPRESS_PORT: 8080
      WORDPRESS_BASE_URL: http://127.0.0.1:8080
      WP_ADMIN_USER: admin
      WP_ADMIN_PASSWORD: password
      WP_ADMIN_EMAIL: admin@example.com
      # Scan the plugin's own surfaces too — its front-end states and its admin
      # settings screen. Without this the run covers the site only, and half of
      # what this demo is about (the plugin's admin screen) goes untested.
      SCAN_PLUGIN: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Cache Playwright browser binary
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS dependencies only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Start WordPress stack
        run: docker compose up -d db wordpress

      - name: Wait for WordPress
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$WORDPRESS_BASE_URL/wp-login.php" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color wordpress
          exit 1

      - name: Bootstrap WordPress content
        run: |
          docker compose run --rm \
            -e WORDPRESS_BASE_URL="$WORDPRESS_BASE_URL" \
            -e WP_ADMIN_USER="$WP_ADMIN_USER" \
            -e WP_ADMIN_PASSWORD="$WP_ADMIN_PASSWORD" \
            -e WP_ADMIN_EMAIL="$WP_ADMIN_EMAIL" \
            wpcli bash /scripts/bootstrap-local.sh

      - name: Run Playwright accessibility tests
        id: playwright
        continue-on-error: true
        run: npm run test:a11y

      - name: Combine per-page scans into one results file
        if: always()
        run: npm run aggregate:a11y

      - name: Report and enforce threshold
        if: always()
        continue-on-error: true
        uses: pattonwebz/axe-report-action@v0.0.3
        with:
          results-file: artifacts/axe-results.json
          fail-on: serious
          show-personas: true

      - name: Upload accessibility artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: a11y-results
          path: |
            artifacts/axe-results.json
            artifacts/a11y/raw
            artifacts/playwright-results.json
            artifacts/playwright-report
            test-results
          if-no-files-found: warn

      - name: Show container logs when tests fail
        if: always() && steps.playwright.outcome == 'failure'
        run: docker compose logs --no-color

      - name: Stop WordPress stack
        if: always()
        run: docker compose down --volumes --remove-orphans

      - name: Fail when accessibility checks fail
        if: steps.playwright.outcome == 'failure'
        run: exit 1
